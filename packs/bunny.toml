# Bunny block-breaker asset set, derived from a reference screenshot.
# The [style] prefix below is a placeholder — `analyze` overwrites it with the
# style actually measured from the reference image.

[api]
base_url  = "https://openrouter.ai/api/v1"
key_env   = "OPENROUTER_API_KEY"
transport = "images"

# Image understanding goes to a local omniroute proxy; image *generation* still
# goes to OpenRouter above, because omniroute serves no image-output models.
[vision]
base_url = "http://localhost:20128/v1"
key_env  = "OMNIROUTE_API_KEY"
model    = "cc/claude-sonnet-5"   # opus-5 rejects image input on this proxy (401)

[pack]
model = "google/gemini-2.5-flash-image"   # ~$0.039/image, cheapest image model

[style]
prefix = """
soft 3D render, glossy plastic and rubber-like material with rounded blocky bricks, top-down flat view, centered symmetrical framing, soft even ambient lighting with bright glowing impact highlight at collision point, subtle shadows under blocks, no hard outlines, rounded geometric brick shapes with soft bevels and glossy highlights, stylized cartoon, not photorealistic, #2E2A4D #6C4CD6 #FFC94D #4CD964 #FFFFFF
"""
plate_prompt = "a block, a rail segment, and a small round character, side by side"

[defaults]
aspect_ratio = "1:1"

[[assets]]
id     = "block_cube"
prompt = "a single rounded game block cube, glossy candy-like surface, subtle inner grid of four smaller studs, flat-on front view"

[[assets]]
id     = "conveyor_rail"
prompt = "a straight segment of a rounded rail track with a chevron arrow marking on it, pale blue-grey metal, soft bevelled edges, horizontal"

[[assets]]
id     = "dispenser"
prompt = "a small launcher chute that a ball is fired from, pale blue-grey metal housing with a vertical slot opening and a ribbed panel on its side, three-quarter view"

[[assets]]
id     = "bunny_ball"
prompt = "a plump round white bunny character shaped like a ball, long upright ears, tiny closed smiling eyes, small pink nose, glossy surface, front view"
